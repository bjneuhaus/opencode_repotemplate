---
# yamllint-Konfiguration: https://yamllint.readthedocs.io/en/stable/rules.html
extends: default

ignore: |
  build/

rules:
  line-length:
    max: 120
    level: warning
  indentation:
    spaces: 2
    indent-sequences: true
  truthy:
    # Nur echte Booleans; verhindert yes/no/on/off-Fallen (YAML 1.1)
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 2
  document-start:
    present: true
    level: warning
  key-duplicates: enable
