---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/component: web
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: >-
      Das httpd-Image schreibt beim Start Konfiguration. Siehe docs/decisions/0003.
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: hello
      automountServiceAccountToken: false
      # Kein runAsUser/fsGroup setzen: OpenShift (SCC restricted-v2) vergibt die UID selbst.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: hello
      containers:
        - name: httpd
          image: hello-web  # Platzhalter, wird per "images" im Overlay ersetzt
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: content
              mountPath: /var/www/html
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: hello-content
