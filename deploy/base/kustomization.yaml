---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Basis: umgebungsneutral, ohne Namespace und ohne Image-Tag.
# Umgebungen (Namespace, Replicas, Image, Ressourcen) kommen aus deploy/overlays/<env>.

labels:
  - pairs:
      app.kubernetes.io/part-of: hello
      app.kubernetes.io/managed-by: kustomize
    includeTemplates: true

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - networkpolicy.yaml

# Inhalt als ConfigMap mit Hash-Suffix: Jede Änderung erzeugt einen neuen Namen
# und löst damit automatisch ein Rollout aus.
configMapGenerator:
  - name: hello-content
    files:
      - content/index.html
