---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hello-dev

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/instance: hello-dev
    includeTemplates: true

# Image immer pinnen – kein ":latest". Verfügbare Tags z.B. mit:
#   skopeo list-tags docker://registry.access.redhat.com/ubi9/httpd-24
images:
  - name: hello-web
    newName: registry.access.redhat.com/ubi9/httpd-24
    newTag: "PIN-ME"  # TEMPLATE: durch konkreten Tag ersetzen
